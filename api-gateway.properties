spring.application.name=api-gateway

server.port=9000

# Invoice Service
spring.cloud.gateway.server.webmvc.routes[0].id=invoice-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://invoice-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/invoices/**

# Invoice Analytics
spring.cloud.gateway.server.webmvc.routes[1].id=invoice-analytics-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://invoice-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/analytics/**

spring.cloud.gateway.routes[2].id=wallet-service
spring.cloud.gateway.routes[2].uri=lb://wallet-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/wallets/**

spring.cloud.gateway.routes[3].id=payment-method-service
spring.cloud.gateway.routes[3].uri=lb://wallet-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payment-methods/**

eureka.client.service-url.default-zone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[4].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/users/**

# Notification Service

spring.cloud.gateway.server.webmvc.routes[5].id=notification-service-route

spring.cloud.gateway.server.webmvc.routes[5].uri=lb://notification-service

spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notifications/**
